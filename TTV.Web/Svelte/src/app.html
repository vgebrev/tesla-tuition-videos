<!doctype html>
<html lang="en-za">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Type"
      content="text/html;charset=UTF-8" />
    <meta
      http-equiv="Content-Type"
      content="text/css;charset=UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Physical Science video lessons and practice exercises for South African high school students. Lessons are compliant with the CAPS and IEB syllabi." />
    <base href="/" />
    <link
      rel="icon"
      type="image/x-icon"
      href="%sveltekit.assets%/favicon.ico" />
    <link
      rel="shortcut icon"
      type="image/x-icon"
      href="%sveltekit.assets%/favicon.ico" />

    <link
      href="%sveltekit.assets%/lib/bootstrap/dist/css/bootstrap.min.css"
      rel="stylesheet" />
    <link
      href="%sveltekit.assets%/lib/bootstrap-icons/font/bootstrap-icons.min.css"
      rel="stylesheet" />
    <link
      href="%sveltekit.assets%/css/app.css"
      rel="stylesheet" />
    %sveltekit.head%
  </head>

  <body data-sveltekit-preload-data="hover">
    <div class="app-container">%sveltekit.body%</div>

    <script src="%sveltekit.assets%/lib/jquery/dist/jquery.slim.min.js"></script>
    <script src="%sveltekit.assets%/lib/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.payfast.co.za/onsite/engine.js"></script>
  </body>
</html>
